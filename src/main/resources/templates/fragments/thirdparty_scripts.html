<head>

</head>
<body>

    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>

    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/metisMenu.min.js}"></script>

    <!-- Application JS File(s) -->
    <script th:src="@{/js/waves.js}"></script>
    <script th:src="@{/js/feather.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>

<div th:fragment="datatables-thirdparty-scripts">

    <script th:src="@{/js/datatables/dataTables.bootstrap5.min.js}"></script>
    <script th:src="@{/js/datatables/jquery.spring-friendly.min.js}"></script>

    <!-- Application JS File(s) -->
    <script th:src="@{/js/waves.js}"></script>
    <script th:src="@{/js/feather.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</div>
